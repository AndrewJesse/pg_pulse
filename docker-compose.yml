services:
  pulse-main:
    image: postgres:18-trixie
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    command: ["postgres", "-c", "shared_preload_libraries=pulse_core,pulse_health", "-c", "wal_level=logical"]

  pulse-shard-0:
    image: postgres:18-trixie
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: shard0
    ports:
      - "5433:5432"

  pulse-shard-1:
    image: postgres:18-trixie
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: shard1
    ports:
      - "5434:5432"

  router:
    build:
      context: .
      dockerfile: docker/router/Dockerfile
    ports:
      - "6432:6432"
    environment:
      PGHOST: pulse-main
