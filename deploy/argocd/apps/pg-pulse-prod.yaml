apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pg-pulse-prod
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: pg-pulse
  source:
    repoURL: https://github.com/OWNER/REPO
    targetRevision: main
    path: deploy/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: pg-pulse-prod
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
