apiVersion: apps/v1
kind: Deployment
metadata:
  name: rules-engine
  namespace: pg-pulse-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rules-engine
  template:
    metadata:
      labels:
        app: rules-engine
    spec:
      containers:
        - name: rules-engine
          image: ghcr.io/OWNER/pg-pulse-rules:latest
