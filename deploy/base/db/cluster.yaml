apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pulse-main
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  instances: 1
  imageName: ghcr.io/OWNER/pg-pulse-postgres:latest
  postgresql:
    shared_preload_libraries:
      - pulse_core
      - pulse_health
    parameters:
      compute_query_id: "on"
      pulse.max_entries: "1000"
      pulse_health.interval_s: "30"
      wal_level: logical
  storage:
    size: 5Gi
