apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: router-network
  namespace: pg-pulse-dev
spec:
  podSelector:
    matchLabels:
      app: router
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: pg-pulse-client
      ports:
        - protocol: TCP
          port: 6432
